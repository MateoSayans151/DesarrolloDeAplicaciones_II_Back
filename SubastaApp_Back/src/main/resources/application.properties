spring.application.name=subasta-app-back
server.port=8080

# H2 Database (desarrollo)
spring.datasource.url=jdbc:h2:mem:subastadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=subastaapp-secret-key-muy-larga-para-seguridad-256bits-minimo-requerido
jwt.expiration=86400000

# CORS
spring.mvc.cors.allowed-origins=*

# API base path
server.servlet.context-path=/api/v1
